[workspace]
resolver = "3"
members = ["crates/dosvideo"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "EUPL-1.2"
repository = "https://github.com/sunsided/game-toolkit-dosvideo"
homepage = "https://github.com/sunsided/game-toolkit-dosvideo"
authors = ["Markus Mayer"]
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

[workspace.dependencies]
game-toolkit = "0.11"
env_logger = "0.11"
# Same track as game-toolkit's `synth` feature; no audio I/O, just the sequencer.
synthie = { version = "0.8", default-features = false, features = ["std", "arp"] }

# Examples and debug builds: optimize dependencies so the demos run at full speed.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.game-toolkit-dosvideo]
opt-level = 2
