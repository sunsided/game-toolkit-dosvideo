# game-toolkit-dosvideo — Rust workspace task runner
# https://taskfile.dev
version: '3'

vars:
  PROFILE: '{{ .PROFILE | default "debug" }}'
  PROFILE_FLAG: '{{ if eq .PROFILE "release" }}--release{{ end }}'

  # Headless screenshots: frames to run before capturing, and where the PNGs go.
  SHOT_FRAMES: '{{ .SHOT_FRAMES | default "120" }}'
  SHOT_DIR: '{{ .SHOT_DIR | default "target/shots" }}'

  CRATE: game-toolkit-dosvideo

tasks:
  default:
    cmds:
      - task --list --sort=none
    silent: true

  build:
    desc: Build the workspace, all targets (PROFILE=release for optimized)
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo build --workspace --all-targets {{.PROFILE_FLAG}} {{.CLI_ARGS}}

  run:
    desc: Run a demo in release mode (EXAMPLE=copper_bars by default; or use run:<demo>)
    vars:
      EXAMPLE: '{{ .EXAMPLE | default "copper_bars" | replace "-" "_" }}'
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
      - sh: test -f crates/dosvideo/examples/{{.EXAMPLE}}.rs
        msg: "no demo named '{{.EXAMPLE}}' — see `task examples`"
    cmds:
      - cargo run -p {{.CRATE}} --all-features --example {{.EXAMPLE}} --release {{.CLI_ARGS}}

  run:copper_bars:
    aliases: [run:copper-bars]
    desc: "Demo: Mode 13h raster bars, palette cycling, sine scroller"
    cmds:
      - task: run
        vars: {EXAMPLE: copper_bars}

  run:palette_cycling:
    aliases: [run:palette-cycling]
    desc: "Demo: Animation by palette rotation alone; mid-frame DAC seam on ISA8"
    cmds:
      - task: run
        vars: {EXAMPLE: palette_cycling}

  run:modex_scroll:
    aliases: [run:modex-scroll]
    desc: "Demo: Mode X: hardware scrolling, split-screen status bar, page flipping"
    cmds:
      - task: run
        vars: {EXAMPLE: modex_scroll}

  run:tearing_lab:
    aliases: [run:tearing-lab]
    desc: "Demo: Full-frame copies on ISA8/ISA16/VLB/PCI with different sync strategies"
    cmds:
      - task: run
        vars: {EXAMPLE: tearing_lab}

  run:ega_scroller:
    aliases: [run:ega-scroller]
    desc: "Demo: EGA smooth scrolling with pel panning and latch tile copies"
    cmds:
      - task: run
        vars: {EXAMPLE: ega_scroller}

  run:cga_showcase:
    aliases: [run:cga-showcase]
    desc: "Demo: CGA palettes, composite artifact colors, 160x100 tweak, snow"
    cmds:
      - task: run
        vars: {EXAMPLE: cga_showcase}

  run:tandy:
    desc: "Demo: Tandy 16-color modes and gate-array palette"
    cmds:
      - task: run
        vars: {EXAMPLE: tandy}

  run:hercules:
    desc: "Demo: Hercules 720x348 page flipping, phosphors, MDA text"
    cmds:
      - task: run
        vars: {EXAMPLE: hercules}

  run:svga:
    desc: "Demo: VESA SVGA: banked vs. linear framebuffer, hi-color, panning"
    cmds:
      - task: run
        vars: {EXAMPLE: svga}

  run:crt_dither:
    aliases: [run:crt-dither]
    desc: "Demo: Dithering (Bayer, Floyd-Steinberg) through CRT filter presets; galactic captions"
    cmds:
      - task: run
        vars: {EXAMPLE: crt_dither}

  run:pc_speaker:
    desc: "Demo: PC speaker - piano, synthie tracker music, PLAY strings, effects, PWM samples"
    aliases: [run:pc-speaker]
    cmds:
      - task: run
        vars: {EXAMPLE: pc_speaker}

  run:text_mode:
    aliases: [run:text-mode]
    desc: "Demo: 80x25 text TUI with ratatui windows: blink, cursor, custom character set, galactic alphabet"
    cmds:
      - task: run
        vars: {EXAMPLE: text_mode}

  run:file_shell:
    aliases: [run:file-shell]
    desc: "Demo: DOS-style file shell from ratatui widgets: tree, file list, menus, dialogs, mouse"
    cmds:
      - task: run
        vars: {EXAMPLE: file_shell}

  examples:
    desc: List the demos
    silent: true
    cmds:
      - ls crates/dosvideo/examples/*.rs | xargs -n1 basename | sed 's/\.rs$//'

  shots:
    desc: Run every demo headless and write a PNG of frame SHOT_FRAMES to SHOT_DIR
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - mkdir -p {{.SHOT_DIR}}
      - cargo build -p {{.CRATE}} --all-features --examples --release
      - |
        for f in crates/dosvideo/examples/*.rs; do
          ex=$(basename "$f" .rs)
          DOSVIDEO_SHOT="{{.SHOT_DIR}}/$ex.png" DOSVIDEO_SHOT_FRAMES={{.SHOT_FRAMES}} \
            cargo run -q -p {{.CRATE}} --all-features --example "$ex" --release
        done

  test:
    desc: Run the tests (nextest if installed), then the doctests
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - |
        if command -v cargo-nextest >/dev/null 2>&1; then
          cargo nextest run --workspace {{.CLI_ARGS}}
        else
          cargo test --workspace --lib --bins --tests {{.CLI_ARGS}}
        fi
      - task: test:docs

  test:docs:
    desc: Run the doctests
    cmds:
      - cargo test --workspace --doc

  test:core:
    desc: Test the emulation core alone, without the game-toolkit dependency
    cmds:
      - cargo test -p {{.CRATE}} --no-default-features --lib

  fmt:
    desc: Format all Rust sources
    aliases: [format]
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    sources:
      - ./**/*.rs
    cmds:
      - cargo fmt --all

  lint:
    desc: Lint the workspace (clippy, warnings are errors)
    preconditions:
      - sh: command -v cargo
        msg: "cargo not found — install Rust from https://rustup.rs/"
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings {{.CLI_ARGS}}

  lint:fix:
    desc: Auto-fix clippy lints, then format
    aliases: [fix]
    cmds:
      - cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged {{.CLI_ARGS}}
      - task: fmt

  check:
    desc: Static checks - format check, clippy (with and without the toolkit feature, native + wasm)
    cmds:
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - cargo clippy --workspace --all-targets --all-features -- -D warnings
      - cargo clippy -p {{.CRATE}} --no-default-features --lib -- -D warnings
      - task: check:wasm

  check:wasm:
    desc: Clippy the crate for the browser target (wasm32-unknown-unknown)
    preconditions:
      - sh: rustup target list --installed | grep -qx wasm32-unknown-unknown
        msg: "wasm target missing — run: rustup target add wasm32-unknown-unknown"
    cmds:
      - cargo clippy --target wasm32-unknown-unknown -p {{.CRATE}} --lib -- -D warnings {{.CLI_ARGS}}

  ci:
    desc: Full CI sequence - static checks, then tests and docs
    cmds:
      - task: check
      - task: test
      - task: docs

  docs:
    desc: Build the API docs (warnings are errors)
    env:
      RUSTDOCFLAGS: -D warnings
    cmds:
      - cargo doc --workspace --no-deps {{.CLI_ARGS}}

  docs:open:
    desc: Build the API docs and open them
    cmds:
      - cargo doc --workspace --no-deps --open

  lint:actions:
    desc: Lint the GitHub workflows (actionlint, zizmor)
    preconditions:
      - sh: command -v actionlint
        msg: "actionlint not found - go install github.com/rhysd/actionlint/cmd/actionlint@latest"
      - sh: command -v zizmor
        msg: "zizmor not found - pipx install zizmor (or: cargo install zizmor)"
    cmds:
      - actionlint -color
      - zizmor --format plain .github

  publish:dry:
    desc: Package the crate and build it from the package, without uploading
    cmds:
      - cargo publish -p {{.CRATE}} --dry-run {{.CLI_ARGS}}

  release:
    desc: "Bump the version, stamp CHANGELOG.md, commit, tag and push (VERSION=x.y.z); CI publishes"
    requires:
      vars: [VERSION]
    preconditions:
      - sh: command -v cargo-release
        msg: "cargo-release not found - cargo install cargo-release --locked"
    prompt: "Release {{.VERSION}}: bump, commit, tag v{{.VERSION}} and push?"
    cmds:
      - cargo release {{.VERSION}} --execute --no-publish

  clean:
    desc: Remove build output
    status:
      - test ! -d target
    cmds:
      - cargo clean
