name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch / PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test · docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ALSA + D-Bus headers for kira (game-toolkit audio), udev for gilrs (gamepads).
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev libudev-dev pkg-config

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # The emulation core must stay dependency-free.
      - name: Clippy (no default features)
        run: cargo clippy -p game-toolkit-dosvideo --no-default-features --lib --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Test (core only)
        run: cargo test -p game-toolkit-dosvideo --no-default-features --lib --locked

      # Fail on broken intra-doc links before docs.rs ever sees them.
      - name: Docs
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      # Build the crate from its packaged form, as crates.io will. A git dependency
      # (tracking an unreleased game-toolkit) cannot be packaged: cargo drops the
      # `git` source and resolves from crates.io, so skip until it is a release again.
      - name: Package
        run: |
          git_deps=$(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '[.packages[] | select(.name == "game-toolkit-dosvideo")
                      | .dependencies[] | select((.source // "") | startswith("git+")) | .name]
                     | unique | join(", ")')
          if [ -n "$git_deps" ]; then
            echo "::warning title=Package skipped::git dependencies, not publishable: $git_deps"
            exit 0
          fi
          cargo package -p game-toolkit-dosvideo --locked

  wasm:
    name: wasm (browser)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy (wasm32, all features)
        run: cargo clippy --target wasm32-unknown-unknown -p game-toolkit-dosvideo --lib --all-features --locked -- -D warnings

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev libudev-dev pkg-config

      # Keep in sync with `rust-version` in the workspace Cargo.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked
