[package]
name = "game-toolkit-dosvideo"
description = "DOS-era PC graphics and sound for game-toolkit: VGA, Mode X, EGA, CGA, Hercules, Tandy and VESA SVGA at the register level, a beam-accurate CRT, a CRT shader and the PC speaker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/game-toolkit-dosvideo"
authors.workspace = true
rust-version.workspace = true
keywords = ["dos", "vga", "retro", "gamedev", "crt"]
categories = ["game-development", "emulators", "graphics", "multimedia::audio"]
readme = "../../README.md"
include = ["src/**", "fonts/**", "examples/**", "Cargo.toml"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.release]
pre-release-replacements = [
  # Turn the pending notes into the release's section and open a fresh [Unreleased] above it.
  { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}", exactly = 1 },
  # Point [Unreleased] at the new tag and add a compare link for the release.
  { file = "../../CHANGELOG.md", search = "\\[Unreleased\\]: (\\S+)/compare/(\\S+)\\.\\.\\.HEAD", replace = "[Unreleased]: $1/compare/{{tag_name}}...HEAD\n[{{version}}]: $1/compare/$2...{{tag_name}}", exactly = 1 },
]

[features]
default = ["toolkit"]
## game-toolkit integration: `run`, `DosGame`, `DosScreen`, keyboard/mouse mapping.
toolkit = ["dep:game-toolkit"]
## Play synthie tracker songs on the PC speaker (`speaker_synth::SpeakerTracker`).
synth = ["dep:synthie"]
## A ratatui `Backend` that draws into text mode (`tui::DosBackend`).
ratatui = ["dep:ratatui-core"]

[dependencies]
game-toolkit-dosaudio = { workspace = true }
game-toolkit-dosbus = { workspace = true }
game-toolkit = { workspace = true, optional = true }
synthie = { workspace = true, optional = true }
ratatui-core = { workspace = true, optional = true }

[dev-dependencies]
env_logger = { workspace = true }
ratatui = { workspace = true }
synthie = { workspace = true }

[lints]
workspace = true


